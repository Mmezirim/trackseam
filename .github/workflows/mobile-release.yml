# Builds store releases without a local Mac. Run it from the Actions tab.
# Secrets and one-time setup are described in docs/RELEASE.md.
name: Mobile release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which store build to make
        type: choice
        options: [both, ios, android]
        default: both

env:
  VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://trackseam.onrender.com/api' }}

jobs:
  ios:
    if: inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # App Store uploads must be built with the current Xcode / iOS SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build web app and sync iOS project
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      # Automatic signing with the API key: Xcode creates or reuses a
      # cloud-managed distribution certificate and the App Store profile, so no
      # .p12 or provisioning profile has to be exported from a Mac.
      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      # Fails the run early if the app icon didn't make it into the build
      # (TestFlight then shows a blank white icon).
      - name: Check app icon is in the build
        run: |
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP/Info.plist"
          xcrun assetutil --info "$APP/Assets.car" | grep -c '"AppIcon"' | xargs -I{} echo "AppIcon renditions in Assets.car: {}"
          xcrun assetutil --info "$APP/Assets.car" | grep -q '"AppIcon"'

      - name: Export and upload to App Store Connect
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app and sync Android project
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build signed App Bundle
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TRACKSEAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TRACKSEAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TRACKSEAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          export TRACKSEAM_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          cd android && bash gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: trackseam-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
